<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CronoVest — Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="stars-layer"></div>
  <div id="nav-root"></div>

  <div class="app-content">
    <header class="welcome-banner">
      <div>
        <h1 id="welcome-title">Bem-vindo!</h1>
        <p>Aqui está um resumo da sua rotina de estudos hoje.</p>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="dashboard-search-input" placeholder="Pesquisar uma matéria...">
      </div>
    </header>

    <section class="page-section">
      <div class="stat-grid" id="dashboard-stats"></div>
    </section>

    <section class="page-section">
      <h2 class="section-title">
        <i class="fa-solid fa-star"></i> Favoritos
        <a href="escolha.html" class="see-all">Ver todos</a>
      </h2>
      <div id="favorites-list" class="schedule-strip"></div>
    </section>

    <section class="page-section">
      <h2 class="section-title">
        <i class="fa-solid fa-clock-rotate-left"></i> Continuar estudando
        <a href="escolha.html" class="see-all">Ver todos</a>
      </h2>
      <div id="recent-list" class="schedule-strip"></div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
