<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CronoVest — Organize seus estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stars-layer"></div>

  <main class="hero-page">
    <div class="hero-content">
      <div class="hero-orbit">
        <div class="hero-orbit-ring ring-outer">
          <span class="orbit-chip"><i class="fa-solid fa-book"></i></span>
          <span class="orbit-chip"><i class="fa-solid fa-flask"></i></span>
        </div>
        <div class="hero-orbit-ring ring-inner">
          <span class="orbit-chip"><i class="fa-solid fa-pen"></i></span>
        </div>
        <div class="hero-orbit-core">CV</div>
      </div>

      <p class="eyebrow">Cronogramas de estudo</p>
      <h1 class="hero-title">Organize sua rotina com o <span>CronoVest</span></h1>
      <p class="hero-subtitle">
        Monte cronogramas personalizados ou use modelos prontos para ENEM e FUVEST.
        Acompanhe seu progresso dia a dia, sem perder nada ao atualizar a página.
      </p>

      <button id="btn-comecar" class="btn-primary" type="button">
        Começar <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
